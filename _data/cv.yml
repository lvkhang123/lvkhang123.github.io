- title: Research Experience
  type: time_table
  contents:
    - title: Undergraduate Research Assistant
      institution: Department of Physics and Astronomy, George Mason University, Fairfax, Virginia, United States.
      year: Nov 2023 - Present
      description:
      - Supervised by Dr. Paul So and Dr. Ernest Barreto. 
      - Perform computational modeling of spiking neuron activity of Rulkov map with tools such as linear maps, bifurcation diagrams, and basin of attractions using Python. 
      - Determine the fractal behavior of Rulkov map's basin of attraction through computational and mathematical analysis. 

    - title: Graduate Research Assistant 
      institution: Arch Laboratory, Department of Psychology, George Mason University, Fairfax, Virginia, United States.
      year: Jan 2025 - Present
      description:
      - Supervised by Dr. James Thompson
      - Analyze fMRI and TMS data to study the functional connectivity of brain dynamics. 

    - title: Undergraduate Research Assistant
      institution: Arch Laboratory, Department of Psychology, George Mason University, Fairfax, Virginia, United States.
      year: Jan 2024 - Apr 2024
      description:
        - Work under Ph.D candidate Lindsay Shaffer in the Cognitive and Behavioral Neuroscience, with research on reward positivity.
        - Assist setting up electroencephalography (EEG) experiments by recruiting and scheduling participants, collecting data, and assist graduate students researchers with data analysis. 
        - Participate in the design, administration, and maintenance of psychophysical EEG experiments by programming aspects of the experiment and providing technical troubleshooting. 
